name: Deploy Cloudveil to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html favicon.svg styles.css paper-theme.css game.js LICENSE _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5

